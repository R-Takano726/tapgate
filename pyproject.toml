[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapgate"
version = "0.1.0"
description = "A private approval inbox for Codex, Claude Code, iPhone and Apple Watch"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = []
[project.optional-dependencies]
push = ["httpx[http2]>=0.28,<1", "PyJWT[crypto]>=2.10,<3"]
[project.scripts]
tapgate = "watchgate.cli:main"
[tool.setuptools]
packages = ["watchgate"]
include-package-data = true
[tool.setuptools.package-data]
watchgate = ["web/*"]
